<svg viewBox="0 0 640 300" role="img" aria-labelledby="kz-t" xmlns="http://www.w3.org/2000/svg">
  <title id="kz-t">Kreislauf des Katastrophenmanagements: Ereignis, Bewältigung, Wiederaufbau, Vorsorge</title>
  <rect width="640" height="300" fill="#f8fafc" class="sk-sky"/>
  <circle cx="210" cy="150" r="90" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="210" cy="150" r="90" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="9 11" class="sk-flow"/>
  <g fill="#475569"><path transform="translate(273.6 86.4) rotate(45)" d="M-7 -6 L7 0 L-7 6Z"/><path transform="translate(273.6 213.6) rotate(135)" d="M-7 -6 L7 0 L-7 6Z"/><path transform="translate(146.4 213.6) rotate(225)" d="M-7 -6 L7 0 L-7 6Z"/><path transform="translate(146.4 86.4) rotate(315)" d="M-7 -6 L7 0 L-7 6Z"/></g>
  <g>
    <rect x="140" y="40" width="140" height="42" rx="12" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
    <rect x="230" y="129" width="140" height="42" rx="12" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
    <rect x="140" y="218" width="140" height="42" rx="12" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
    <rect x="50" y="129" width="140" height="42" rx="12" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  </g>
  <g class="sk-t" text-anchor="middle" style="stroke:none;font-size:13px">
    <text x="210" y="58">Ereignis</text><text x="300" y="147">Bewältigung</text><text x="210" y="236">Wiederaufbau</text><text x="120" y="147">Vorsorge</text>
  </g>
  <g text-anchor="middle" style="font-size:10.5px;fill:#374151">
    <text x="210" y="73">Naturgefahr trifft Raum</text><text x="300" y="162">Nothilfe, Evakuierung</text><text x="210" y="251">„build back better“</text><text x="120" y="162">Prävention, Anpassung</text>
  </g>
  <text class="sk-t" x="400" y="226" style="font-size:14px;fill:#0f766e">Resilienz</text>
  <text class="sk-s" x="400" y="244" style="font-size:11.5px">Fähigkeit eines Raumes, Schocks</text>
  <text class="sk-s" x="400" y="260" style="font-size:11.5px">zu verkraften und sich anzupassen.</text>
  <text class="sk-s" x="400" y="52" style="font-size:11.5px">Vorsorge senkt die Vulnerabilität</text>
  <text class="sk-s" x="400" y="68" style="font-size:11.5px">und damit das Risiko beim nächsten</text>
  <text class="sk-s" x="400" y="84" style="font-size:11.5px">Ereignis.</text>
</svg>
