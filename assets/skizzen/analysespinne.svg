<svg viewBox="0 0 640 300" role="img" aria-labelledby="as-t" xmlns="http://www.w3.org/2000/svg">
  <title id="as-t">Analysespinne: Bewertung mehrerer Kriterien auf einer Skala von 0 bis 5 im Netzdiagramm</title>
  <rect width="640" height="300" fill="#f8fafc" class="sk-sky"/>
  <g fill="none" stroke="#cbd5e1" stroke-width="1.5">
    <polygon points="200,40 296,110 260,222 140,222 104,110"/>
    <polygon points="200,68 269,119 243,200 157,200 131,119"/>
    <polygon points="200,96 242,128 226,178 174,178 158,128"/>
    <path d="M200 150 L200 40 M200 150 L296 110 M200 150 L260 222 M200 150 L140 222 M200 150 L104 110"/>
  </g>
  <polygon points="200,62 280,114 236,208 150,196 122,124" fill="#3b82f6" fill-opacity=".3" stroke="#2563eb" stroke-width="3" class="sk-draw" pathLength="1"/>
  <polygon points="200,92 252,126 214,168 168,166 150,132" fill="#f97316" fill-opacity=".25" stroke="#ea580c" stroke-width="3" stroke-dasharray="6 4"/>
  <g class="sk-s" text-anchor="middle"><text x="200" y="30">Kriterium A</text><text x="326" y="112">Kriterium B</text><text x="278" y="240">Kriterium C</text><text x="122" y="240">Kriterium D</text><text x="74" y="112">Kriterium E</text></g>
  <g>
    <text class="sk-t" x="380" y="50">Analysespinne – Schritte</text>
    <text class="sk-s" x="380" y="76">1. Kriterien auswählen (3–8)</text>
    <text class="sk-s" x="380" y="96">2. Skala festlegen (z. B. 0 bis 5)</text>
    <text class="sk-s" x="380" y="116">3. Achsen strahlenförmig anordnen</text>
    <text class="sk-s" x="380" y="136">4. Werte eintragen, Punkte verbinden</text>
    <text class="sk-s" x="380" y="156">5. Flächen vergleichen und deuten</text>
    <rect x="380" y="190" width="14" height="14" rx="3" fill="#2563eb"/><text class="sk-s" x="402" y="202">Raum 1</text>
    <rect x="380" y="214" width="14" height="14" rx="3" fill="#ea580c"/><text class="sk-s" x="402" y="226">Raum 2</text>
    <text class="sk-s" x="380" y="256">Größere Fläche = höhere Gesamtausprägung</text>
  </g>
</svg>
