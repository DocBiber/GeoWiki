    <path d="M-7 -6 L7 0 L-7 6Z" transform="translate(590 150) rotate(90)"/><path d="M-7 -6 L7 0 L-7 6Z" transform="translate(498 205) rotate(180)"/><path d="M-7 -6 L7 0 L-7 6Z" transform="translate(408 150) rotate(270)"/><path d="M-7 -6 L7 0 L-7 6Z" transform="translate(498 90)"/>
