    <marker id="hz-ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1e3a8a"/></marker>
    <marker id="hz-ar2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b45309"/></marker>
  </defs>
  <rect width="640" height="215" fill="url(#hz-sky)" class="sk-sky"/>
  <line x1="20" y1="72" x2="620" y2="72" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
