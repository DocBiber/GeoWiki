<svg viewBox="0 0 640 300" role="img" aria-labelledby="hz-t" xmlns="http://www.w3.org/2000/svg">
  <title id="hz-t">Globale Zirkulation im Meridionalschnitt: Hadley-, Ferrel- und Polarzelle vom Äquator zum Pol</title>
  <defs>
