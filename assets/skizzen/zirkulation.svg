  <text class="sk-s" x="122" y="162" text-anchor="middle">thermisch direkt</text>
  <text class="sk-t" x="306" y="146" text-anchor="middle">Ferrel-Zelle</text>
  <text class="sk-s" x="306" y="162" text-anchor="middle">indirekt</text>
  <text class="sk-t" x="498" y="146" text-anchor="middle">Polarzelle</text>
