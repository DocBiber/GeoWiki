<svg viewBox="0 0 640 290" role="img" aria-labelledby="et-t" xmlns="http://www.w3.org/2000/svg">
  <title id="et-t">Effusive und explosive Eruption im Vergleich: dünnflüssige, gasarme Lava gegenüber zähflüssigem, gasreichem Magma</title>
  <defs>
    <linearGradient id="et-sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#f4f8ff"/></linearGradient>
  </defs>
  <rect width="640" height="290" fill="url(#et-sk)" class="sk-sky"/>
  <rect x="0" y="226" width="640" height="64" fill="#8d7b68"/>
  <line x1="320" y1="14" x2="320" y2="226" stroke="#94a3b8" stroke-dasharray="4 5"/>
  <!-- effusiv -->
  <path d="M14 226 C80 222 130 194 160 188 C190 194 240 222 306 226 Z" fill="#5d5049" stroke="#3f342b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M160 188 C190 192 210 206 236 224" fill="none" stroke="#ff6a3d" stroke-width="7" stroke-linecap="round"/>
  <path class="sk-flow" d="M160 188 C190 192 210 206 236 224" fill="none" stroke="#ffd166" stroke-width="2.5" stroke-dasharray="7 7" stroke-linecap="round"/>
  <path d="M160 188 C140 196 120 208 100 224" fill="none" stroke="#ff6a3d" stroke-width="5" stroke-linecap="round"/>
  <path class="sk-flow" d="M160 188 C140 196 120 208 100 224" fill="none" stroke="#ffd166" stroke-width="2" stroke-dasharray="6 7" stroke-linecap="round"/>
  <ellipse cx="160" cy="187" rx="9" ry="3" fill="#ffb84d" class="sk-glow"/>
  <g class="sk-spark"><circle cx="160" cy="176" r="2.5" fill="#ff8a3d"/></g>
  <text class="sk-t" x="160" y="30" text-anchor="middle" style="font-size:15px;fill:#b45309">Effusiv</text>
  <text class="sk-s" x="160" y="48" text-anchor="middle">ruhiges Ausfließen von Lava</text>
  <g class="sk-s" text-anchor="middle" style="font-size:12px">
    <text x="160" y="248">dünnflüssig · gasarm</text><text x="160" y="264">basaltisch (SiO₂ niedrig)</text><text x="160" y="280">Schildvulkan, Lavaströme</text>
  </g>
  <!-- explosiv -->
  <path d="M340 226 C392 220 440 160 462 110 L478 98 L494 110 C516 160 560 220 620 226 Z" fill="#5d5049" stroke="#3f342b" stroke-width="2" stroke-linejoin="round"/>
  <g class="sk-ash"><circle cx="478" cy="92" r="16" fill="#6b7280"/></g>
  <g class="sk-ash" style="animation-delay:1.2s"><circle cx="478" cy="92" r="14" fill="#6b7280"/></g>
  <g class="sk-ash" style="animation-delay:2.4s"><circle cx="478" cy="92" r="16" fill="#6b7280"/></g>
  <ellipse cx="478" cy="98" rx="10" ry="3.5" fill="#ffb84d" class="sk-glow"/>
  <path d="M484 112 C504 150 530 190 566 222" fill="none" stroke="#9ca3af" stroke-width="9" stroke-linecap="round" opacity=".8"/>
  <path class="sk-flow" d="M484 112 C504 150 530 190 566 222" fill="none" stroke="#e5e7eb" stroke-width="2.5" stroke-dasharray="6 8" stroke-linecap="round"/>
  <text class="sk-t" x="480" y="30" text-anchor="middle" style="font-size:15px;fill:#b91c1c">Explosiv</text>
  <text class="sk-s" x="480" y="48" text-anchor="middle">Zerreißen des Magmas, Aschesäule</text>
  <text class="sk-s" x="528" y="140" style="font-size:11px">pyroklastischer Strom</text>
  <g class="sk-s" text-anchor="middle" style="font-size:12px">
    <text x="480" y="248">zähflüssig · gasreich</text><text x="480" y="264">andesitisch/rhyolithisch (SiO₂ hoch)</text><text x="480" y="280">Schichtvulkan, Caldera</text>
  </g>
</svg>
