<svg viewBox="0 0 640 300" role="img" aria-labelledby="kp-t" xmlns="http://www.w3.org/2000/svg">
  <title id="kp-t">Kern-Peripherie-Modell: Entzugseffekte in den Kern und Ausbreitungseffekte in die Peripherie</title>
  <rect width="640" height="300" fill="#f8fafc" class="sk-sky"/>
  <ellipse cx="200" cy="150" rx="176" ry="124" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <ellipse cx="200" cy="150" rx="70" ry="48" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M52 82 C90 96 120 118 140 132" stroke="#c2410c"/><path d="M52 218 C90 204 120 182 140 168" stroke="#c2410c"/><path d="M200 38 C200 70 200 90 200 106" stroke="#c2410c"/>
    <path d="M262 132 C290 114 318 100 342 84" stroke="#15803d"/><path d="M262 168 C290 186 318 200 342 216" stroke="#15803d"/><path d="M200 194 C200 220 200 236 200 262" stroke="#15803d"/>
  </g>
  <g fill="none" stroke-width="2" stroke-dasharray="7 8" stroke-linecap="round" class="sk-flow">
    <path d="M52 82 C90 96 120 118 140 132" stroke="#fff7ed"/><path d="M52 218 C90 204 120 182 140 168" stroke="#fff7ed"/><path d="M200 38 C200 70 200 90 200 106" stroke="#fff7ed"/>
    <path d="M262 132 C290 114 318 100 342 84" stroke="#f0fdf4"/><path d="M262 168 C290 186 318 200 342 216" stroke="#f0fdf4"/><path d="M200 194 C200 220 200 236 200 262" stroke="#f0fdf4"/>
  </g>
  <text class="sk-t" x="200" y="146" text-anchor="middle">Kern</text>
  <text class="sk-s" x="200" y="162" text-anchor="middle" style="font-size:11px">Wachstumspol</text>
  <text class="sk-t" x="118" y="60">Peripherie</text>
  <g>
    <rect x="388" y="52" width="14" height="14" rx="3" fill="#c2410c"/>
    <text class="sk-t" x="410" y="64">Entzugseffekte (Backwash)</text>
    <text class="sk-s" x="410" y="82">Abwanderung von Kapital und</text><text class="sk-s" x="410" y="98">Fachkräften in den Kern</text>
    <rect x="388" y="130" width="14" height="14" rx="3" fill="#15803d"/>
    <text class="sk-t" x="410" y="142">Ausbreitungseffekte (Spread)</text>
    <text class="sk-s" x="410" y="160">Nachfrage, Innovation und</text><text class="sk-s" x="410" y="176">Arbeitsplätze für die Peripherie</text>
    <text class="sk-t" x="388" y="222">Kumulative Verursachung (Myrdal)</text>
    <text class="sk-s" x="388" y="240">Überwiegen die Entzugseffekte,</text><text class="sk-s" x="388" y="256">wächst das Gefälle weiter.</text>
  </g>
</svg>
