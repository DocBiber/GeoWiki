  <rect width="460" height="320" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <g transform="translate(26 300)"><path d="M0 -14 L6 0 L0 -4 L-6 0 Z" fill="#1f2937"/><text class="sk-s" x="0" y="-18" text-anchor="middle" style="font-weight:700">N</text></g>
  <text class="sk-s" x="40" y="292" style="font-size:11px">◄ Abfluss zur Nordsee (nach Westen)</text>

  <g class="sk-lead"><path d="M474 30 L420 30"/><path d="M474 82 L424 80"/><path d="M474 123 L446 117"/><path d="M474 172 L402 172"/><path d="M474 234 L440 234"/><path d="M474 292 L440 292"/></g>
  <text class="sk-t" x="478" y="26">Inlandeis</text>
  <text class="sk-s" x="478" y="41">Eisfließrichtung ↓</text>
  <text class="sk-t" x="478" y="74">Zungenbecken</text>
  <text class="sk-s" x="478" y="89">Seen, Grundmoräne,</text>
  <text class="sk-s" x="478" y="103">Drumlins</text>
  <text class="sk-t" x="478" y="130">Endmoräne</text>
  <text class="sk-t" x="478" y="168">Sander</text>
  <text class="sk-s" x="478" y="183">verflochtene Rinnen</text>
  <text class="sk-t" x="478" y="230">Urstromtal</text>
  <text class="sk-s" x="478" y="245">sammelt Schmelzwasser</text>
  <text class="sk-t" x="478" y="288">Altmoränenland</text>
  <text class="sk-s" x="478" y="312" style="font-size:11px">schematisch, Norden oben</text>
