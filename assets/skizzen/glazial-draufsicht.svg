    <path d="M320 138 L232 206 L418 206 Z" fill="#ead29a" opacity=".9"/>
    <g fill="none" stroke="#4aa3df" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 5" class="sk-flow">
      <path d="M150 134 C140 160 100 182 78 204"/><path d="M150 134 C150 160 148 180 148 204"/><path d="M150 134 C162 160 198 182 226 204"/>
      <path d="M320 140 C310 166 276 184 252 204"/><path d="M320 140 C320 166 318 184 318 204"/><path d="M320 140 C334 166 372 184 402 204"/>
    </g>

