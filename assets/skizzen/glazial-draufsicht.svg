      <ellipse cx="226" cy="96" rx="4" ry="11" transform="rotate(5 226 96)"/><ellipse cx="252" cy="104" rx="4" ry="11" transform="rotate(8 252 104)"/>
      <ellipse cx="372" cy="104" rx="4" ry="11"/><ellipse cx="434" cy="98" rx="4" ry="11" transform="rotate(6 434 98)"/>
    </g>
    <g fill="#4aa3df" class="sk-lake"><ellipse cx="150" cy="92" rx="26" ry="11"/><ellipse cx="320" cy="98" rx="30" ry="11"/><ellipse cx="410" cy="78" rx="14" ry="7"/></g>

    <!-- Inlandeis -->
    <path d="M0 0 H460 V54 C430 68 410 44 380 58 C352 70 332 86 300 76 C270 66 250 50 220 62 C190 74 170 84 140 70 C110 58 90 70 60 64 C30 58 14 62 0 56 Z" fill="url(#gd-ice)" stroke="#5b8db5" stroke-width="2"/>
