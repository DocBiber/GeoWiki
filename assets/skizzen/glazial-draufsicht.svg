    <path d="M0 126 C40 114 80 114 110 122 C140 134 170 136 200 122 C230 110 270 116 290 128 C320 144 350 138 380 122 C410 110 440 114 460 120" fill="none" stroke="#7b5b3a" stroke-width="10" stroke-linecap="round"/>
    <path d="M0 126 C40 114 80 114 110 122 C140 134 170 136 200 122 C230 110 270 116 290 128 C320 144 350 138 380 122 C410 110 440 114 460 120" fill="none" stroke="#c5a070" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round"/>

