    <path d="M0 207 H460 M0 261 H460" stroke="#8a6b4a" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M460 234 C410 226 380 246 330 236 C280 226 250 248 200 238 C150 226 110 248 60 236 C30 230 14 234 0 236" fill="none" stroke="#3b82b6" stroke-width="8" stroke-linecap="round"/>
    <path d="M460 234 C410 226 380 246 330 236 C280 226 250 248 200 238 C150 226 110 248 60 236 C30 230 14 234 0 236" fill="none" stroke="#fff" stroke-width="2.2" stroke-dasharray="8 9" class="sk-flow" opacity=".9"/>

