<svg viewBox="0 0 640 320" role="img" aria-labelledby="gd-t" xmlns="http://www.w3.org/2000/svg">
  <title id="gd-t">Glaziale Serie in der Vogelperspektive: Inlandeis, Zungenbecken mit Grundmoräne, Endmoräne, Sander und Urstromtal</title>
  <defs>
    <linearGradient id="gd-ice" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfe6f7"/></linearGradient>
    <clipPath id="gd-clip"><rect width="460" height="320" rx="6"/></clipPath>
    <marker id="gd-ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1d4ed8"/></marker>
  </defs>
  <rect width="640" height="320" fill="#f8fafc" class="sk-sky"/>
  <g clip-path="url(#gd-clip)">
    <rect y="56" width="460" height="264" fill="#b9bf8a"/>
    <rect y="60" width="460" height="60" fill="#a9b27a"/>
    <rect y="124" width="460" height="82" fill="#f1e3b3"/>
    <rect y="206" width="460" height="56" fill="#d3e4b6"/>

