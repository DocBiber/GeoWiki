<svg viewBox="0 0 640 300" role="img" aria-labelledby="mb-t" xmlns="http://www.w3.org/2000/svg">
  <title id="mb-t">Massenbilanz eines Gletschers: Nährgebiet, Zehrgebiet und Gleichgewichtslinie</title>
  <defs>
    <clipPath id="mb-ice"><path d="M30 62 L220 86 L420 175 L500 218 L420 200 L220 120 L30 90 Z"/></clipPath>
