  <rect width="640" height="300" fill="#eaf3ff" class="sk-sky"/>
  <path d="M0 90 L30 90 L220 120 L420 200 L500 218 L640 250 V300 H0 Z" fill="#8d7b68" stroke="#5d5049" stroke-width="2" stroke-linejoin="round"/>
  <g clip-path="url(#mb-ice)">
    <rect x="30" y="40" width="270" height="200" fill="#f1f8ff"/>
    <rect x="300" y="40" width="210" height="200" fill="#8ec1f5"/>
  </g>
  <path d="M30 62 L220 86 L420 175 L500 218 L420 200 L220 120 L30 90 Z" fill="none" stroke="#3b82c4" stroke-width="2" stroke-linejoin="round"/>
  <path d="M60 80 L220 104 L400 183" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="8 8" stroke-linecap="round" class="sk-flow"/>
  <g class="sk-flow" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="5 7" stroke-linecap="round"><path d="M110 52 L110 68"/><path d="M170 58 L170 76"/><path d="M230 64 L230 84"/></g>
  <path d="M300 100 V160" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4"/>
