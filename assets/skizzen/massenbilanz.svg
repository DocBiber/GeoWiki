  <text class="sk-t" x="40" y="30">Nährgebiet</text>
  <text class="sk-s" x="40" y="44" style="font-size:11px">Akkumulation: Schneezuwachs &gt; Abschmelzen</text>
  <text class="sk-t" x="300" y="94" text-anchor="middle" style="fill:#b91c1c">Gleichgewichtslinie</text>
  <text class="sk-t" x="372" y="148">Zehrgebiet</text>
  <text class="sk-s" x="372" y="162" style="font-size:11px">Ablation: Abschmelzen &gt; Schnee</text>
  <text class="sk-s" x="500" y="236" style="font-size:11px">Schmelzwasser</text>

  <text class="sk-t" x="320" y="278" text-anchor="middle">Massenbilanz = Akkumulation − Ablation</text>
