<svg viewBox="0 0 640 300" role="img" aria-labelledby="th-t" xmlns="http://www.w3.org/2000/svg">
  <title id="th-t">Treibhauseffekt: kurzwellige Sonnenstrahlung, langwellige Wärmeabstrahlung und Gegenstrahlung der Treibhausgase</title>
  <defs>
    <linearGradient id="th-sp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
    <marker id="th-y" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#facc15"/></marker>
    <marker id="th-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ef4444"/></marker>
    <marker id="th-w" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#e5e7eb"/></marker>
  </defs>
  <rect width="640" height="92" fill="url(#th-sp)" class="sk-sky"/>
  <rect y="92" width="640" height="100" fill="#93c5fd" class="sk-sky"/>
  <rect y="192" width="640" height="38" fill="#bfdbfe" class="sk-sky"/>
  <rect y="230" width="640" height="70" fill="#4d7c3a"/>
  <rect y="230" width="640" height="10" fill="#3d6a2c"/>
  <circle cx="60" cy="44" r="26" fill="#fde047" class="sk-glow"/>
  <g fill="#fde047"><circle cx="60" cy="44" r="20"/></g>

  <g fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 8" class="sk-flow">
    <path stroke="#facc15" marker-end="url(#th-y)" d="M96 62 L236 226"/>
    <path stroke="#e5e7eb" marker-end="url(#th-w)" d="M190 132 L252 30" style="animation-direction:normal"/>
    <path stroke="#ef4444" marker-end="url(#th-r)" d="M380 226 L380 128"/>
    <path stroke="#ef4444" marker-end="url(#th-r)" d="M440 124 L440 26" stroke-dasharray="9 8"/>
    <path stroke="#ef4444" marker-end="url(#th-r)" d="M500 140 L500 224"/>
    <path stroke="#ef4444" marker-end="url(#th-r)" d="M570 226 L570 36"/>
  </g>
  <g class="sk-pulse" fill="#1f2937">
    <g><circle cx="378" cy="118" r="7"/><circle cx="394" cy="124" r="5"/><circle cx="364" cy="124" r="5"/></g>
    <g style="animation-delay:.5s"><circle cx="498" cy="130" r="7"/><circle cx="514" cy="136" r="5"/><circle cx="484" cy="136" r="5"/></g>
  </g>
  <text class="sk-s" x="378" y="108" text-anchor="middle">CO₂</text>
  <text class="sk-s" x="500" y="120" text-anchor="middle">CH₄</text>

  <text class="sk-t" x="108" y="30" style="stroke:none;fill:#fef9c3">Sonne</text>
  <text class="sk-s" x="108" y="46" style="stroke:none;fill:#fef9c3">kurzwellig</text>
  <text class="sk-t" x="262" y="62" style="stroke:none;fill:#f9fafb">≈ 30 % reflektiert</text>
  <text class="sk-s" x="262" y="78" style="stroke:none;fill:#e5e7eb">Wolken, Eis, Albedo</text>
  <text class="sk-t" x="14" y="170">Atmosphäre mit Treibhausgasen</text>
  <text class="sk-t" x="448" y="210">Gegenstrahlung</text>
  <text class="sk-s" x="448" y="226">wärmt die Erdoberfläche</text>
  <text class="sk-t" x="14" y="258" style="stroke:none;fill:#f0fdf4">Erdoberfläche: absorbiert, strahlt Wärme (IR) ab</text>
  <text class="sk-s" x="14" y="276" style="stroke:none;fill:#dcfce7">mehr Treibhausgase → mehr Absorption → Erwärmung</text>
  <text class="sk-s" x="450" y="46" style="stroke:none;fill:#fecaca">in den Weltraum</text>
</svg>
