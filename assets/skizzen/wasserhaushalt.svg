<svg viewBox="0 0 640 330" role="img" aria-labelledby="wh-t" xmlns="http://www.w3.org/2000/svg">
  <title id="wh-t">Wasserhaushalt eines Einzugsgebiets: Niederschlag, Verdunstung, Abfluss und Speicheränderung</title>
  <defs>
    <linearGradient id="wh-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe3f7"/><stop offset="1" stop-color="#f4f8ff"/></linearGradient>
    <marker id="wh-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f2937"/></marker>
  </defs>
  <rect width="640" height="330" fill="url(#wh-sky)" class="sk-sky"/>
  <g fill="#fff" stroke="#9fb4c9" stroke-width="1.5"><path d="M70 74 C50 74 46 52 66 50 C70 30 104 28 112 46 C132 42 146 58 134 74 Z"/><path d="M210 66 C190 66 188 46 206 44 C212 28 242 28 248 44 C266 44 274 62 258 66 Z"/><path d="M420 74 C400 74 396 52 416 50 C420 30 456 28 464 46 C484 42 498 58 486 74 Z"/></g>
