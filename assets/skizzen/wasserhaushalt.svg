  <path d="M250 154 C264 180 282 204 300 222 C330 230 380 232 470 236 C540 238 590 232 628 232" fill="none" stroke="#38a0e0" stroke-width="7" stroke-linecap="round"/>
  <path class="sk-flow" d="M250 154 C264 180 282 204 300 222 C330 230 380 232 470 236 C540 238 590 232 628 232" fill="none" stroke="#e8f6ff" stroke-width="2.5" stroke-linecap="round"/>
  <g stroke="#2563eb" stroke-width="3" stroke-linecap="round">
    <line class="sk-dropfall" x1="70" y1="86" x2="64" y2="98" style="animation-delay:0s"/><line class="sk-dropfall" x1="100" y1="86" x2="94" y2="98" style="animation-delay:.6s"/><line class="sk-dropfall" x1="126" y1="86" x2="120" y2="98" style="animation-delay:1.2s"/>
    <line class="sk-dropfall" x1="216" y1="78" x2="210" y2="90" style="animation-delay:.3s"/><line class="sk-dropfall" x1="240" y1="78" x2="234" y2="90" style="animation-delay:.9s"/><line class="sk-dropfall" x1="262" y1="78" x2="256" y2="90" style="animation-delay:1.5s"/>
