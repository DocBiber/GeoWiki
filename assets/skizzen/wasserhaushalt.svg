  <text class="sk-t" x="14" y="24">P — Niederschlag</text>
  <text class="sk-s" x="14" y="40">Zufluss ins Einzugsgebiet</text>
  <text class="sk-t" x="400" y="24">ET — Verdunstung</text>
  <text class="sk-s" x="400" y="40">inkl. Transpiration, Verlust an die Atmosphäre</text>
  <text class="sk-t" x="470" y="214">Q — Abfluss</text>
  <text class="sk-s" x="440" y="266" style="stroke:none">Oberfläche und Grundwasser</text>
  <text class="sk-t" x="14" y="278">ΔS — Speicheränderung</text>
  <text class="sk-s" x="14" y="296">Boden, Grundwasser, Schnee: Endbestand minus Anfangsbestand</text>
  <text class="sk-t" x="14" y="190">Wasserscheide</text>
  <text class="sk-t" x="320" y="320" text-anchor="middle" style="fill:#1f2937">P = ET + Q + ΔS</text>
