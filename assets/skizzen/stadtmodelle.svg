<svg viewBox="0 0 640 290" role="img" aria-labelledby="sm-t" xmlns="http://www.w3.org/2000/svg">
  <title id="sm-t">Stadtstrukturmodelle: Ringmodell nach Burgess, Sektorenmodell nach Hoyt und Mehrkernemodell nach Harris und Ullman</title>
  <rect width="640" height="290" fill="#f8fafc" class="sk-sky"/>
  <g stroke="#e2e8f0" stroke-width="2"><line x1="215" y1="14" x2="215" y2="276"/><line x1="426" y1="14" x2="426" y2="276"/></g>

  <!-- Burgess -->
  <g class="sk-pulse" style="animation-duration:4s">
    <circle cx="108" cy="140" r="90" fill="#bbf7d0" stroke="#fff" stroke-width="2"/>
    <circle cx="108" cy="140" r="72" fill="#84cc16" stroke="#fff" stroke-width="2"/>
    <circle cx="108" cy="140" r="54" fill="#a8a29e" stroke="#fff" stroke-width="2"/>
    <circle cx="108" cy="140" r="36" fill="#f59e0b" stroke="#fff" stroke-width="2"/>
    <circle cx="108" cy="140" r="18" fill="#dc2626" stroke="#fff" stroke-width="2"/>
  </g>
  <g class="sk-t" style="stroke:none;fill:#111827;font-size:12px;font-weight:700" text-anchor="middle">
    <text x="108" y="144" style="fill:#fff">1</text><text x="108" y="116" dy="0">2</text><text x="108" y="98">3</text><text x="108" y="80">4</text><text x="108" y="62">5</text>
  </g>
  <text class="sk-t" x="108" y="24" text-anchor="middle">Ringmodell (Burgess)</text>
  <text class="sk-s" x="108" y="256" text-anchor="middle">1 Zentrum · 2 Übergang · 3 Arbeiter</text>
  <text class="sk-s" x="108" y="272" text-anchor="middle">4 Mittelschicht · 5 Pendlerzone</text>

  <!-- Hoyt -->
  <g class="sk-pulse" style="animation-duration:4s;animation-delay:.6s">
    <path d="M320 140 L335.6 51.4 A90 90 0 0 1 404.6 109.2 Z" fill="#22c55e"/>
    <path d="M320 140 L404.6 109.2 A90 90 0 0 1 389 197.9 Z" fill="#a3e635"/>
    <path d="M320 140 L389 197.9 A90 90 0 0 1 304.4 228.6 Z" fill="#64748b"/>
    <path d="M320 140 L304.4 228.6 A90 90 0 0 1 235.4 109.2 Z" fill="#f59e0b"/>
    <path d="M235.4 109.2 L320 140 L335.6 51.4 A90 90 0 0 0 235.4 109.2 Z" fill="#a3e635"/>
  </g>
  <g stroke="#fff" stroke-width="2"><line x1="320" y1="140" x2="335.6" y2="51.4"/><line x1="320" y1="140" x2="404.6" y2="109.2"/><line x1="320" y1="140" x2="389" y2="197.9"/><line x1="320" y1="140" x2="304.4" y2="228.6"/><line x1="320" y1="140" x2="235.4" y2="109.2"/></g>
  <g class="sk-t" style="stroke:none;fill:#111827;font-size:11px;font-weight:700" text-anchor="middle">
    <text x="364" y="90">hoch</text><text x="376" y="150">mittel</text><text x="350" y="200" style="fill:#fff">Industrie</text><text x="268" y="170">niedrig</text><text x="288" y="82">mittel</text>
  </g>
  <circle cx="320" cy="140" r="16" fill="#dc2626" stroke="#fff" stroke-width="2"/>
  <text class="sk-t" x="320" y="24" text-anchor="middle">Sektorenmodell (Hoyt)</text>
  <text class="sk-s" x="320" y="256" text-anchor="middle">Wachstum in Sektoren entlang</text>
  <text class="sk-s" x="320" y="272" text-anchor="middle">der Verkehrsachsen, gleiche Nutzung</text>

  <!-- Harris & Ullman -->
  <rect x="440" y="48" width="190" height="184" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <g class="sk-pulse" style="animation-duration:3.6s;animation-delay:1.2s">
    <circle cx="520" cy="140" r="24" fill="#dc2626"/>
    <circle cx="590" cy="190" r="22" fill="#64748b"/>
    <circle cx="474" cy="204" r="18" fill="#a855f7"/>
    <circle cx="470" cy="84" r="22" fill="#f59e0b"/>
    <circle cx="570" cy="80" r="20" fill="#22c55e"/>
    <circle cx="594" cy="128" r="11" fill="#ef4444"/>
  </g>
  <g class="sk-t" style="stroke:none;fill:#fff;font-size:11px;font-weight:700" text-anchor="middle">
    <text x="520" y="144">CBD</text><text x="590" y="194">Ind.</text><text x="474" y="208">Gew.</text><text x="470" y="88" style="fill:#111827">Wohnen</text><text x="570" y="84" style="fill:#111827">Wohnen</text>
  </g>
  <text class="sk-t" x="535" y="24" text-anchor="middle">Mehrkernmodell</text>
  <text class="sk-s" x="535" y="42" text-anchor="middle">(Harris &amp; Ullman)</text>
  <text class="sk-s" x="535" y="256" text-anchor="middle">mehrere Kerne mit eigener</text>
  <text class="sk-s" x="535" y="272" text-anchor="middle">Spezialisierung, Nebenzentrum</text>
</svg>
