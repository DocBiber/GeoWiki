<svg viewBox="0 0 640 300" role="img" aria-labelledby="wb-t" xmlns="http://www.w3.org/2000/svg">
  <title id="wb-t">Wachstum der Weltbevölkerung von 1800 bis 2100 mit Prognose</title>
  <rect width="640" height="300" fill="#f8fafc" class="sk-sky"/>
  <g stroke="#cbd5e1" stroke-width="1"><path d="M70 210 H590 M70 170 H590 M70 130 H590 M70 90 H590 M70 50 H590"/></g>
  <rect x="447" y="30" width="143" height="220" fill="#e0f2fe" opacity=".6"/>
  <g fill="none" stroke="#475569" stroke-width="1.5"><path d="M70 30 V250 H590"/></g>
  <g class="sk-s" text-anchor="end" style="font-size:11px"><text x="64" y="254">0</text><text x="64" y="214">2</text><text x="64" y="174">4</text><text x="64" y="134">6</text><text x="64" y="94">8</text><text x="64" y="54">10 Mrd.</text></g>
  <g class="sk-s" text-anchor="middle" style="font-size:11px"><text x="70" y="268">1800</text><text x="240" y="268">1900</text><text x="410" y="268">2000</text><text x="580" y="268">2100</text></g>
  <path d="M70 230 C150 228 210 222 240 218 C270 212 300 202 342 190 L366 170 L388 150 L408 130 L429 110 L447 90 L447 250 L70 250 Z" fill="#22c55e" opacity=".18"/>
  <path class="sk-draw" pathLength="1" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="M70 230 C150 228 210 222 240 218 C270 212 300 202 342 190 L366 170 L388 150 L408 130 L429 110 L447 90"/>
  <path fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round" d="M447 90 C465 72 480 62 495 56 C515 48 530 45 546 44 C560 44 570 46 580 48"/>
  <g fill="#15803d" stroke="#fff" stroke-width="1.5"><circle cx="286" cy="210" r="4.5"/><circle cx="366" cy="170" r="4.5"/><circle cx="408" cy="130" r="4.5"/><circle cx="447" cy="90" r="4.5"/><circle cx="495" cy="56" r="4.5"/></g>
  <g class="sk-s" style="font-size:11.5px">
    <text x="292" y="226">2 Mrd. (1927)</text>
    <text x="360" y="166" text-anchor="end">4 Mrd. (1974)</text>
    <text x="414" y="146">6 Mrd. (1999)</text>
    <text x="438" y="96" text-anchor="end">8 Mrd. (2022)</text>
    <text x="500" y="76">≈ 9,7 Mrd. (2050)</text>
  </g>
  <text class="sk-t" x="76" y="176" style="font-size:12px">Industrialisierung,</text>
  <text class="sk-s" x="76" y="219" style="display:none">.</text>
  <text class="sk-s" x="76" y="191">sinkende Sterberate (Medizin, Hygiene)</text>
  <text class="sk-t" x="456" y="272" style="font-size:12px;fill:#0369a1">Prognose</text>
  <text class="sk-s" x="76" y="46" style="font-size:12px">Weltbevölkerung in Milliarden</text>
</svg>
