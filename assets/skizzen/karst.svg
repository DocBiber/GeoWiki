  <text class="sk-s" x="12" y="288">wasserstauende Schicht (Ton / Mergel)</text>
  <text class="sk-s" x="20" y="18">CaCO₃ + CO₂ + H₂O → Ca²⁺ + 2 HCO₃⁻</text>
