  <text class="sk-t" x="362" y="46">O — organische Auflage</text>
  <text class="sk-s" x="362" y="62">Streu, Humusbildung</text>
  <text class="sk-t" x="362" y="92">A — Oberboden</text>
  <text class="sk-s" x="362" y="108">humos, Auswaschung (Eluviation)</text>
  <text class="sk-t" x="362" y="150">B — Unterboden</text>
  <text class="sk-s" x="362" y="166">Anreicherung (Illuviation): Ton, Eisen</text>
  <text class="sk-t" x="362" y="210">C — Untergrund</text>
  <text class="sk-s" x="362" y="226">angewittertes Ausgangsgestein</text>
  <text class="sk-t" x="362" y="262">R — festes Muttergestein</text>
  <text class="sk-s" x="362" y="278">Quelle der Bodenbildung</text>
  <text class="sk-s" x="30" y="308">Verwitterung von unten nach oben ↑ · Sickerwasser nach unten ↓</text>
