<svg viewBox="0 0 640 320" role="img" aria-labelledby="ri-t" xmlns="http://www.w3.org/2000/svg">
  <title id="ri-t">Risikoschema: Naturgefahr, Exposition und Vulnerabilität bestimmen das Risiko, Resilienz begrenzt die Folgen</title>
  <defs>
    <marker id="ri-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f2937"/></marker>
    <marker id="ri-gr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker>
  </defs>
  <rect width="640" height="320" fill="#f4f6fa" class="sk-sky"/>
  <g font-family="sans-serif">
    <rect x="24" y="24" width="220" height="64" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text class="sk-t" x="134" y="52" text-anchor="middle" style="stroke:none">Naturgefahr (Hazard)</text>
    <text class="sk-s" x="134" y="72" text-anchor="middle" style="stroke:none">z. B. Eruption, Hochwasser</text>
    <rect x="24" y="116" width="220" height="64" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text class="sk-t" x="134" y="144" text-anchor="middle" style="stroke:none">Exposition</text>
    <text class="sk-s" x="134" y="164" text-anchor="middle" style="stroke:none">Menschen, Gebäude, Infrastruktur</text>
    <rect x="24" y="208" width="220" height="64" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text class="sk-t" x="134" y="236" text-anchor="middle" style="stroke:none">Vulnerabilität</text>
    <text class="sk-s" x="134" y="256" text-anchor="middle" style="stroke:none">Anfälligkeit der Betroffenen</text>
    <text class="sk-t" x="134" y="107" text-anchor="middle" style="stroke:none;font-size:20px">+</text>
    <text class="sk-t" x="134" y="199" text-anchor="middle" style="stroke:none;font-size:20px">+</text>
  </g>
  <path d="M250 56 C300 56 300 148 346 148" fill="none" stroke="none"/>
  <path class="sk-flow" d="M250 56 C300 56 300 148 346 148 M250 148 H346 M250 240 C300 240 300 148 346 148" fill="none" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" style="stroke-dasharray:6 6"/>
  <path d="M346 148 l-9 -5 v10 z" fill="#1f2937"/>
  <g class="sk-pulse">
    <rect x="352" y="104" width="250" height="88" rx="14" fill="#1f2937"/>
    <text x="477" y="142" text-anchor="middle" fill="#fff" font-size="19" font-weight="800" font-family="sans-serif">Risiko</text>
    <text x="477" y="166" text-anchor="middle" fill="#d1d5db" font-size="12.5" font-family="sans-serif">möglicher Schäden</text>
  </g>
  <rect x="352" y="224" width="250" height="56" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text class="sk-t" x="477" y="248" text-anchor="middle" style="stroke:none">Resilienz</text>
  <text class="sk-s" x="477" y="267" text-anchor="middle" style="stroke:none">Vorsorge, Bewältigung, Erholung</text>
  <path d="M477 222 V198" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#ri-gr)"/>
  <path class="sk-flow sk-flow-up" d="M477 222 V198" fill="none" stroke="#fff" stroke-width="2" style="stroke-dasharray:4 7"/>
  <text class="sk-s" x="496" y="214" style="fill:#15803d;stroke:none">begrenzt Folgen</text>
  <text class="sk-s" x="352" y="94" style="stroke:none">Lernhilfe, keine Berechnungsformel</text>
</svg>
